[package]
name = "rythme-playground"
version = "1.0.0"
edition = "2021"
description = "The Rythme interpreter compiled to WebAssembly, for the web playground."
license = "MIT"
publish = false

[lib]
# cdylib: the WebAssembly module of the standalone page (web/); rlib: the same
# interpreter for the website, whose Rust client (site/client) calls `run` directly.
crate-type = ["cdylib", "rlib"]

[features]
default = ["c-api"]
# The functions the page of web/ calls (`rythme_alloc`, `rythme_run`…); the website
# turns them off.
c-api = []

[dependencies]
rythme = { path = ".." }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
