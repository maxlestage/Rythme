[package]
name = "rythme-playground"
version = "0.1.0"
edition = "2021"
description = "The Rythme interpreter compiled to WebAssembly, for the web playground."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rythme = { path = ".." }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
