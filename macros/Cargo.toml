[package]
name = "rythme-macros"
version = "1.0.0"
edition = "2021"
description = "The `t!` macro of Rythme: each message in every language of src/i18n/."
license = "MIT"
repository = "https://github.com/maxlestage/Rythme"

# No dependency: the catalogs are read with the tokenizer of the compiler.
[lib]
proc-macro = true
