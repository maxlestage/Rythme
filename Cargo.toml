[package]
name = "rythme"
version = "0.1.0"
edition = "2021"
description = "Rythme: a simple, purely functional programming language with help everywhere."
license = "MIT"
readme = "README.md"
repository = "https://github.com/maxlestage/Rythme"
keywords = ["language", "interpreter", "functional", "education"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "rythme"
path = "src/main.rs"

# The interactive mode needs a terminal; the web playground (wasm32) has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
