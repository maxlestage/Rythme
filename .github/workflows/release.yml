name: Release

# Builds ready-to-use programs for Linux, macOS and Windows when a version tag
# (like v0.1.0) is pushed, and attaches them to the GitHub release with:
# - SHA256SUMS, the checksums that install.sh and install.ps1 verify;
# - rythme.rb and winget/*.yaml, the Homebrew formula and the winget manifests
#   of this version (packaging/render.sh fills in packaging/);
# - install.sh and install.ps1 themselves.
# With a HOMEBREW_TAP_TOKEN secret, the formula is also pushed to the tap
# maxlestage/homebrew-rythme (skipped otherwise). See packaging/README.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the version $crate of Cargo.toml"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner: the programs then work with older glibc too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: rythme-linux-x86_64.tar.gz
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            archive: rythme-linux-arm64.tar.gz
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: rythme-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: rythme-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: rythme-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross linker (Linux arm64)
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release rythme
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/rythme.exe -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, Homebrew formula and winget manifests
        run: |
          (cd dist && sha256sum rythme-* > SHA256SUMS && cat SHA256SUMS)
          packaging/render.sh "$GITHUB_REF_NAME" dist/SHA256SUMS packages
          cp install.sh install.ps1 dist/
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            packages/rythme.rb
            packages/winget/*.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages

  homebrew:
    name: Update the Homebrew tap (when HOMEBREW_TAP_TOKEN exists)
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: No HOMEBREW_TAP_TOKEN secret
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::notice::No HOMEBREW_TAP_TOKEN secret: the formula is only attached to the release (see packaging/README.md)."
      - uses: actions/download-artifact@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          name: packages
          path: packages
      - name: Push the formula to maxlestage/homebrew-rythme
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/maxlestage/homebrew-rythme.git" tap
          mkdir -p tap/Formula
          cp packages/rythme.rb tap/Formula/rythme.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rythme.rb
          git diff --cached --quiet || git commit -m "rythme ${GITHUB_REF_NAME#v}"
          git push
