[package]
name = "zed-rythme"
version = "0.1.0"
edition = "2021"
description = "Rythme for the Zed editor: colors with the Tree-sitter grammar, and the language server `rythme lsp`."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7.0"
