id = "rythme"
name = "Rythme"
description = "Rythme: colors, indentation, outline, and the language server (`rythme lsp`): problems as you type, documentation, completion, go to definition, rename, formatting."
version = "1.0.0"
schema_version = 1
authors = ["The Rythme authors"]
repository = "https://github.com/maxlestage/Rythme"

# The grammar is in the same repository (editors/tree-sitter-rythme), at
# the commit `rev`. Zed wants a commit SHA (not a branch, so that a
# version of the extension always gets the same grammar): change it when
# the grammar changes. GitHub keeps the commits of a pull request, even
# squashed, so this one stays reachable; after merging, set it to the
# commit of the default branch that has the grammar.
[grammars.rythme]
repository = "https://github.com/maxlestage/Rythme"
rev = "dfad31b1b0db77ba12fefa4ad062a0f0ea5694b5"
path = "editors/tree-sitter-rythme"

[language_servers.rythme]
name = "Rythme"
languages = ["Rythme"]
